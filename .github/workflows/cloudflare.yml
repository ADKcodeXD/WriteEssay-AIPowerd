name: Cloudflare CI/CD

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn
      - name: Install locked dependencies (CLI installers are not needed)
        run: yarn install --frozen-lockfile --ignore-scripts
      - name: Worker API regression tests
        run: yarn test:cloudflare
      - name: Build frontend, admin and API
        run: yarn build:cloudflare
      - name: Validate Worker bundle and bindings
        run: yarn wrangler deploy --dry-run --outdir .cloudflare/dry-run
      - uses: actions/upload-artifact@v4
        with:
          name: cloudflare-build
          include-hidden-files: true
          retention-days: 7
          path: |
            .cloudflare/api.mjs
            apps/english-learn-web/.open-next

  deploy:
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      AI_SETTINGS_ENCRYPTION_KEY: ${{ secrets.AI_SETTINGS_ENCRYPTION_KEY }}
      TEXT_GEARS_SECRET: ${{ secrets.TEXT_GEARS_SECRET }}
      DEPLOY_URL: ${{ vars.DEPLOY_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn
      - run: yarn install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: cloudflare-build
          path: .
      - name: Validate configuration before deployment
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$DEPLOY_URL"
          node scripts/deploy-secrets.mjs --check
      - name: Deploy Worker and provision resources
        run: node scripts/cloudflare-deploy.mjs
      - name: Apply runtime secrets (never build-time secrets)
        run: node scripts/deploy-secrets.mjs
      - name: Verify deployed application
        run: node scripts/smoke-cloudflare.mjs
