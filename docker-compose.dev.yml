version: '3'
services:
  api:
    build:
      context: .
      dockerfile: apps/english-learn-api/Dockerfile
      target: deps
    command: npm run dev
    ports:
      - "3001:3001"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-your_default_redis_password}
    env_file:
      - ./apps/english-learn-api/.env.local
    depends_on:
      - redis

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data
    command: redis-server --requirepass ${REDIS_PASSWORD:-your_default_redis_password} --appendonly yes
    healthcheck:
      test: redis-cli -a ${REDIS_PASSWORD:-your_default_redis_password} ping | grep PONG
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  redis_dev_data: 