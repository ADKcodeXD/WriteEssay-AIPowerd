version: '3'

services:
  redis:
    image: redis:alpine
    container_name: englishlearn-redis
    command: redis-server /usr/local/etc/redis/redis.conf
    env_file:
      - ./english-learn-api/.env.production
    ports:
      - "6379:6379"
    volumes:
      - ./redis.conf:/usr/local/etc/redis/redis.conf
      - redis-data:/data
      - redis-logs:/var/log/redis
    networks:
      - app-network

  api:
    image: dockeradk1/englishlearn-api:latest
    container_name: english-learn-api
    ports:
      - "3001:3001"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    env_file:
      - ./english-learn-api/.env.production
    depends_on:
      - redis
    networks:
      - app-network

  web:
    image: dockeradk1/englishlearn-web:latest
    container_name: english-learn-web
    ports:
      - "3000:3000"
    env_file:
      - ./english-learn-web/.env.production
    depends_on:
      - api
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  redis-data:
    driver: local
  redis-logs:
    driver: local